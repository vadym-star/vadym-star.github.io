<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Poppins:wght@400;500;600&display=swap">
<style>
  :root{--ink:#0f172a;--body:#3f4a5a;--body-2:#6b7686;--green:#54b435;--green-dark:#458f2c;--blue:#2f6fd6;
    --serif:'Merriweather',Georgia,serif;--sans:'Poppins',system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;font-family:var(--sans);color:var(--body);
    background:radial-gradient(46% 50% at 15% 5%,rgba(84,180,53,.08),transparent 60%),radial-gradient(44% 50% at 88% 10%,rgba(47,111,214,.09),transparent 62%),#fff}
  .box{padding:40px 28px;max-width:560px}
  .ver{font-family:var(--serif);font-weight:900;font-size:clamp(60px,12vw,110px);line-height:1;
    background:linear-gradient(120deg,var(--green-dark) 8%,var(--blue) 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-family:var(--serif);color:var(--ink);font-size:clamp(24px,4vw,34px);margin:18px 0 0}
  p{font-size:17px;margin:16px 0 0;color:var(--body)}
  a{display:inline-flex;align-items:center;gap:8px;margin-top:30px;font-weight:600;font-size:15px;color:#fff;
    background:var(--green);padding:13px 24px;border-radius:13px;text-decoration:none;box-shadow:0 6px 18px rgba(84,180,53,.28);cursor:pointer;transition:transform .18s,background .18s}
  a:hover{background:var(--green-dark);transform:translateY(-2px)}
  a svg{width:15px;height:15px;transform:scaleX(-1)}
</style>
</head>
<body>
  <div class="box">
    <div class="ver">A3</div>

  </div>
</body>
